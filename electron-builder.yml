appId: com.harnesshub.app
productName: HarnessHub
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{tsconfig.json,tsconfig.node.json}'
  - '!{.gitignore,pnpm-lock.yaml}'
win:
  icon: build/icon.png
  target:
    - nsis
    - portable
portable:
  # 免安装版命名避免与 nsis 的 -Setup 混淆
  artifactName: ${productName}-${version}-portable.${ext}
mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  # 命名避免与 win 的 -Setup 混淆；arch 默认跟随构建机（Apple Silicon 出 arm64，Intel 出 x64）
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: HarnessHub
  # 安装界面语言：2052 = 简体中文（electron-builder LCID Dec）
  language: 2052
artifactName: ${productName}-${version}-Setup.${ext}
